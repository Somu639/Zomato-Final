# Nixpacks config for Railway (Python 3.11)
# https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -e ."]

[start]
cmd = "uvicorn backend.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
