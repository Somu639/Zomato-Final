# Railway deployment — https://docs.railway.com/guides/config-as-code
# Full runbook: Docs/Deployment-Railway-Vercel.md

[build]
builder = "NIXPACKS"
buildCommand = "pip install -e ."

[deploy]
startCommand = "uvicorn backend.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
