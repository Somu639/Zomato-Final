# Render Blueprint — https://render.com/docs/blueprint-spec
# Docs: Docs/Deployment-Render-Vercel.md

services:
  - type: web
    name: zm-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -e .
    startCommand: uvicorn backend.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: .
      - key: WEB_HOST
        value: 0.0.0.0
      - key: RENDER
        value: "true"
      - key: DATASET_CACHE_DIR
        value: data/cache
      - key: LOG_LEVEL
        value: INFO
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
